name: Build Release Artifacts

on:
  push:
    branches:
      - feature/iptv-external-audio-source
      - debrify-lite-android
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run (or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - macos
          - windows
          - ios
          - tvos
          - linux
          - linux-arm64

permissions:
  contents: write

jobs:
  android:
    if: github.event_name == 'push' || github.event_name == 'release' || github.event.inputs.job == 'all' || github.event.inputs.job == 'android'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure TMDB build token
      shell: python
      env:
        TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
      run: |
        import json, os
        from pathlib import Path
        token = os.environ.get("TMDB_READ_ACCESS_TOKEN", "").strip()
        if not token:
            print("TMDB_READ_ACCESS_TOKEN is not configured; continuing with an empty build value.")
        config = Path(os.environ["RUNNER_TEMP"]) / "debrify-build-config.json"
        config.write_text(json.dumps({"TMDB_READ_ACCESS_TOKEN": token}), encoding="utf-8")

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: Cache dependencies and MediaKit native libraries
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          .dart_tool
          ~/.gradle/caches
          ~/.gradle/wrapper
          packages/media_kit_libs_android_video_patched/android/libs
        key: ${{ runner.os }}-debrify-android-${{ hashFiles('**/pubspec.lock', '**/*.gradle*', 'dev/scripts/build_android_media_kit_libraries.sh') }}
        restore-keys: |
          ${{ runner.os }}-debrify-android-

    - name: Get dependencies
      run: flutter pub get

    - name: Install Android native build dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool ninja-build nasm pkg-config python3-pip python3-setuptools unzip wget zip
        python3 -m pip install --user meson==1.7.0
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Select Java 17 for pinned MediaKit native build
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Build PGS-capable MediaKit Android libraries
      if: steps.cache.outputs.cache-hit != 'true'
      run: dev/scripts/build_android_media_kit_libraries.sh packages/media_kit_libs_android_video_patched/android/libs

    - name: Restore Java 21 for Debrify Android build
      uses: actions/setup-java@v4
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Restore Java 21 for cached MediaKit build
      if: steps.cache.outputs.cache-hit == 'true'
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Prepare signing for release builds
      if: github.event_name != 'push' || github.ref_name != 'debrify-lite-android'
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
        cat > android/key.properties << EOF
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        storeFile=release.keystore
        EOF

    - name: Build Lite APK
      if: github.event_name == 'push' && github.ref_name == 'debrify-lite-android'
      env:
        ORG_GRADLE_PROJECT_debrifyLocalDiagnostics: "false"
      run: flutter build apk --debug --dart-define=DEBRIFY_LOCAL_VALIDATION=false --dart-define-from-file="${{ runner.temp }}/debrify-build-config.json"

    - name: Build Release APK
      if: github.event_name != 'push' || github.ref_name != 'debrify-lite-android'
      env:
        ORG_GRADLE_PROJECT_debrifyLocalDiagnostics: "false"
      run: flutter build apk --release --dart-define=DEBRIFY_LOCAL_VALIDATION=false --dart-define-from-file="${{ runner.temp }}/debrify-build-config.json"

    - name: Reject debuggable release APK
      if: github.event_name != 'push' || github.ref_name != 'debrify-lite-android'
      shell: bash
      run: |
        debuggable=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable build/app/outputs/flutter-apk/app-release.apk)
        test "$debuggable" = "false"

    - name: Verify packaged Android subtitle decoders
      if: github.event_name != 'push' || github.ref_name != 'debrify-lite-android'
      run: dev/scripts/verify_android_subtitle_decoders.sh build/app/outputs/flutter-apk/app-release.apk

    - name: Upload Lite debug APK
      if: github.event_name == 'push' && github.ref_name == 'debrify-lite-android'
      uses: actions/upload-artifact@v4
      with:
        name: debrify-lite-android-debug
        path: build/app/outputs/flutter-apk/app-debug.apk
        if-no-files-found: error

    - name: Upload APK as artifact (feature branch)
      if: github.event_name == 'push' && github.ref_name != 'debrify-lite-android'
      uses: actions/upload-artifact@v4
      with:
        name: debrify-lite-android
        path: build/app/outputs/flutter-apk/app-release.apk
        if-no-files-found: error

    - name: Rename APK (release)
      if: github.event_name == 'release'
      run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/debrify-${{ github.event.release.tag_name }}.apk

    - name: Attach APK to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: build/app/outputs/flutter-apk/debrify-${{ github.event.release.tag_name }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK as artifact (manual)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: debrify-android
        path: build/app/outputs/flutter-apk/app-release.apk
