name: Validate External Audio Android

on:
  push:
    branches:
      - debrify-external-audio-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Validate external-audio Dart files
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/screens/video_player_screen.dart lib/screens/video_player/widgets/tracks_sheet.dart

      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define=DEBRIFY_LOCAL_VALIDATION=false

      - name: Verify APK exists
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

      - name: Validate APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          file "$APK" | grep -E "Zip archive|Android package|Java archive"
          unzip -t "$APK" >/dev/null
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$AAPT2"
          test -x "$APKSIGNER"
          "$AAPT2" dump badging "$APK" >/tmp/apk-badging.txt
          grep -q "^package:" /tmp/apk-badging.txt
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Prepare direct APK asset
        shell: bash
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-debug.apk debrify-external-audio-debug.apk
          unzip -t debrify-external-audio-debug.apk >/dev/null

      - name: Upload validation APK
        uses: actions/upload-artifact@v4
        with:
          name: debrify-external-audio-validation
          path: debrify-external-audio-debug.apk
          if-no-files-found: error

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: external-audio-validation-${{ github.run_number }}
          name: External Audio Validation ${{ github.run_number }}
          prerelease: true
          files: debrify-external-audio-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
