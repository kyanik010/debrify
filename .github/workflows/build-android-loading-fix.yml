name: Build Android APK - IPTV Loading Fix

on:
  pull_request:
    branches: [arabic-localization-full]
  push:
    branches: [main, arabic-localization-full, feature/iptv-only-ui-redesign, feature/iptv-onboarding-flow, feature/eagle-x-tv, feature/eagle-x-dpad-remote]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact fix
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable

      - name: Prepare Arabic settings UI
        run: dart run tool/apply_arabic_settings.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool ninja-build nasm pkg-config python3-pip python3-setuptools unzip wget zip
          python3 -m pip install --user meson==1.7.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Java 17 for MediaKit native build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build PGS-capable MediaKit Android libraries
        run: dev/scripts/build_android_media_kit_libraries.sh packages/media_kit_libs_android_video_patched/android/libs

      - name: Restore Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing secret KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "Missing secret STORE_PASSWORD"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing secret KEY_PASSWORD"; exit 1; }
          rm -f android/app/release.keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=upload
          storeFile=release.keystore
          EOF

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_debrifyLocalDiagnostics: "false"
        run: flutter build apk --release --build-number=$((1000 + GITHUB_RUN_NUMBER)) --dart-define=DEBRIFY_LOCAL_VALIDATION=false

      - name: Verify APK is non-debuggable
        run: |
          debuggable=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable build/app/outputs/flutter-apk/app-release.apk)
          test "$debuggable" = "false"

      - name: Verify Flutter engine and app code exist for every ABI
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" | grep -E 'lib/[^/]+/(libflutter|libapp)\.so'
          for abi in armeabi-v7a arm64-v8a x86_64; do
            for lib in libflutter.so libapp.so; do
              unzip -l "$APK" | grep -q "lib/$abi/$lib" || { echo "Missing lib/$abi/$lib"; exit 1; }
            done
          done

      - name: Verify APK structure, alignment, and signature
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 4 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest min-sdk "$APK"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest target-sdk "$APK"

      - name: Verify packaged Android subtitle decoders
        run: dev/scripts/verify_android_subtitle_decoders.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debrify-android-loading-fix
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
