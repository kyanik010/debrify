name: Build Android APK - IPTV Loading Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact fix
        uses: actions/checkout@v4

      - name: Configure TMDB build token
        shell: python
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: |
          import json, os
          from pathlib import Path
          token = os.environ.get("TMDB_READ_ACCESS_TOKEN", "").strip()
          if not token:
              raise SystemExit("Missing repository secret: TMDB_READ_ACCESS_TOKEN")
          Path(os.environ["RUNNER_TEMP"], "debrify-build-config.json").write_text(
              json.dumps({"TMDB_READ_ACCESS_TOKEN": token}), encoding="utf-8"
          )

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool ninja-build nasm pkg-config python3-pip python3-setuptools unzip wget zip
          python3 -m pip install --user meson==1.7.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Setup Java 17 for MediaKit native build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build PGS-capable MediaKit Android libraries
        run: dev/scripts/build_android_media_kit_libraries.sh packages/media_kit_libs_android_video_patched/android/libs

      - name: Restore Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release.keystore
          EOF

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_debrifyLocalDiagnostics: "false"
        run: flutter build apk --release --dart-define=DEBRIFY_LOCAL_VALIDATION=false --dart-define-from-file="${{ runner.temp }}/debrify-build-config.json"

      - name: Verify APK is non-debuggable
        run: |
          debuggable=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest debuggable build/app/outputs/flutter-apk/app-release.apk)
          test "$debuggable" = "false"

      - name: Verify packaged Android subtitle decoders
        run: dev/scripts/verify_android_subtitle_decoders.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debrify-android-loading-fix
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
